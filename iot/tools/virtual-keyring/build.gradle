plugins {
	id 'com.android.application' version '9.1.1' apply false
	id 'checkstyle'
}

allprojects {
	layout.buildDirectory = rootProject.layout.projectDirectory.dir(
		"../../build/apps/virtual-keyring/${project == rootProject ? 'root' : project.name}")
}

checkstyle {
	toolVersion = '10.26.1'
	configFile = file('config/checkstyle/naver-checkstyle-rules.xml')
	configProperties = [suppressionFile: file('config/checkstyle/naver-checkstyle-suppressions.xml').absolutePath]
	maxWarnings = 0
}

tasks.register('checkstyleAll', Checkstyle) {
	source fileTree('app/src') { include '**/*.java' }, fileTree('core/src') { include '**/*.java' }
	classpath = files()
	reports {
		xml.required = true
		html.required = true
	}
}
