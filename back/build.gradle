plugins {
	id 'java'
	id 'checkstyle'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.e106'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'com.google.firebase:firebase-admin:9.11.0'
	// 프로필 사진: WebP 읽기(ImageIO 플러그인)와 EXIF 방향 읽기
	implementation 'com.twelvemonkeys.imageio:imageio-webp:3.15.3'
	implementation 'com.drewnoakes:metadata-extractor:2.22.0'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

// 네이버 캠퍼스 핵데이 Java 컨벤션 검사 (GitLab 컨벤션 [java-naver]). 경고가 하나라도 있으면 빌드 실패.
checkstyle {
	configFile = file('config/checkstyle/naver-checkstyle-rules.xml')
	configProperties = [suppressionFile: file('config/checkstyle/naver-checkstyle-suppressions.xml').path]
	maxWarnings = 0
}

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'ai-risk-http', 'ai-explanation-http'
	}
}

tasks.register('riskAiSmokeTest', Test) {
	group = 'verification'
	description = 'Verify BE service JWT and risk HTTP against the synthetic loopback FastAPI server'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	dependsOn tasks.named('testClasses')
	outputs.upToDateWhen { false }
	outputs.cacheIf { false }
	useJUnitPlatform {
		includeTags 'ai-risk-http'
	}
	doFirst {
		if (!System.getenv('RISK_TEST_PYTHON')?.trim()) {
			throw new GradleException('riskAiSmokeTest requires RISK_TEST_PYTHON with the AI test dependencies')
		}
	}
}

tasks.register('explanationAiSmokeTest', Test) {
	group = 'verification'
	description = 'Verify service JWT and rule explanations against the synthetic loopback FastAPI server'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	dependsOn tasks.named('testClasses')
	outputs.upToDateWhen { false }
	outputs.cacheIf { false }
	useJUnitPlatform {
		includeTags 'ai-explanation-http'
	}
	doFirst {
		if (!System.getenv('EXPLANATION_TEST_PYTHON')?.trim()) {
			throw new GradleException('explanationAiSmokeTest requires EXPLANATION_TEST_PYTHON with AI dependencies')
		}
	}
}
