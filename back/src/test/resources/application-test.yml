# 테스트. Testcontainers 의 테스트 전용 DB에 테이블을 새로 만들고 끝나면 지운다.
spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
  # 엔티티가 아닌 키링 초기화·TSV3 표(외래 키 없음)도 만든다. 운영은 infra/db/prod-changes 로 만든다.
  sql:
    init:
      mode: always
      schema-locations: classpath:database/keyring-reset-249.sql,classpath:database/keyring-peer-ownership-270.sql,classpath:database/keyring-peer-commands-270.sql,classpath:database/keyring-peer-encounter-270.sql

# 개발·운영의 필수 설정에 넣는 테스트 전용 값(실제 비밀 값이 아니다). 서명 키는 저장소의 테스트 전용 키다.
app:
  withdrawal:
    identity-secret: identity-test-secret-is-at-least-thirty-two-bytes-long
    receipt-secret: receipt-test-secret-is-at-least-thirty-two-bytes-long
    scheduling-enabled: false
    photo-cleanup-scheduling-enabled: false
  keyring:
    dev-settings:
      private-key-file: src/test/resources/keyring/test-only-settings-private.pem
      public-key-file: src/test/resources/keyring/test-only-settings-public.pem
    peer:
      policy-version: 1380991793
      rule-version: 268439809
      lease-seconds: 86400
      opportunity-seconds: 604800
      presence-gap-seconds: 30
      server-public-key-hex: 03a107bff3ce10be1d70dd18e74bc09967e4d6309ba50d5f1ddc8664125531b8
  push:
    token-encryption-key: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
  chat-message-push:
    poll-ms: 1000
  chat-deletion:
    scheduling-enabled: false
  risk:
    scheduling-enabled: false
  ai:
    service:
      # 키·주소는 AI 를 쓰는 테스트가 직접 넣는다.
      environment: test
  async-observation:
    enabled: false
  auth:
    jwt-secret: only-for-automated-tests-not-a-production-secret-123456

  chat-notices:
    scheduling-enabled: false
  pending-emails:
    scheduling-enabled: false
  # 통합 테스트는 한 IP 에서 수십 번 로그인한다. 횟수 제한 동작은 RateLimitFilterTest 가 따로 확인한다.
  rate-limit:
    enabled: false

# 테스트가 만든 사진 파일은 로컬 실행용 폴더와 섞이지 않게 따로 둔다.
tingle:
  ai:
    personal-analysis:
      scheduling-enabled: false
  photo:
    dir: ${java.io.tmpdir}/tingle-photos-test
