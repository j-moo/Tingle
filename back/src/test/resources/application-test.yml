# 테스트. Testcontainers 의 테스트 전용 DB에 테이블을 새로 만들고 끝나면 지운다.
spring:
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  auth:
    jwt-secret: only-for-automated-tests-not-a-production-secret-123456

  chat-notices:
    scheduling-enabled: false

# 테스트가 만든 사진 파일은 로컬 실행용 폴더와 섞이지 않게 따로 둔다.
tingle:
  ai:
    personal-analysis:
      scheduling-enabled: false
  photo:
    dir: ${java.io.tmpdir}/tingle-photos-test
