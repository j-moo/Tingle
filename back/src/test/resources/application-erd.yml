# Only the disposable Testcontainers database; validate the design DDL instead of generating from entities.
spring:
  sql:
    init:
      mode: always
      schema-locations: classpath:database/schema.sql,classpath:database/keyring-reset-249.sql,classpath:database/keyring-peer-ownership-270.sql,classpath:database/keyring-peer-commands-270.sql,classpath:database/keyring-peer-encounter-270.sql
  jpa:
    hibernate:
      ddl-auto: validate
