# 오류 코드별 사용자 표시 문구 (기본 언어 한국어). 다른 언어는 messages_{언어}.properties 로 추가한다.
# 요청 언어(Accept-Language)의 파일에 키가 없으면 이 파일의 문구를 쓴다. 키 규칙: error.{오류 코드}

# 공통
error.INVALID_REQUEST=요청 형식이 올바르지 않습니다.
error.AUTH_REQUIRED=로그인이 필요합니다.
error.ONBOARDING_REQUIRED=가입 단계를 먼저 완료해 주세요.
error.NOT_FOUND=요청한 대상을 찾을 수 없습니다.
error.INTERNAL_ERROR=일시적인 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.
error.IDEMPOTENCY_CONFLICT=다른 요청에 사용된 재시도 키입니다.
error.RESOURCE_NOT_FOUND=제안을 찾을 수 없어요.

# 매칭 제안
error.PROPOSAL_EXPIRED=제안의 응답 시간이 지났거나 접근이 종료됐어요.
error.PROPOSAL_STATE_CONFLICT=현재 상태에서는 선택을 바꿀 수 없어요.

# 소셜 로그인
error.INVALID_PROVIDER=지원하지 않는 로그인 방식입니다.
error.INVALID_SOCIAL_TOKEN=소셜 로그인 정보를 확인할 수 없습니다.
error.SOCIAL_PROVIDER_ERROR=소셜 로그인 서버에 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.

# 약관 동의
error.REQUIRED_AGREEMENT_MISSING=필수 항목에 모두 동의해 주세요.
error.AGREEMENT_VERSION_OUTDATED=약관이 변경되었습니다. 변경된 약관을 확인해 주세요.

# 프로필
error.INVALID_NICKNAME=닉네임은 2~20자의 한글, 영문, 숫자, 공백만 사용할 수 있습니다.
error.INVALID_BIRTH_DATE=생년월일을 확인해 주세요.
error.INVALID_INTRODUCTION=자기소개는 200자, 줄바꿈 3개까지 쓸 수 있습니다.
error.UNDER_AGE=만 19세 이상만 이용할 수 있습니다.
error.NICKNAME_DUPLICATED=이미 사용 중인 닉네임입니다.
error.PROFILE_FIELD_LOCKED=프로필 등록을 마친 뒤에는 성별과 생년월일을 바꿀 수 없습니다.
error.PROFILE_INCOMPLETE=필수 프로필 항목을 모두 입력해 주세요.

# 액세스 토큰 (앱 처리: EXPIRED 만 재발급 1회 시도, INVALID·SESSION_REVOKED 는 바로 로그인 화면)
error.ACCESS_TOKEN_EXPIRED=로그인이 만료되었습니다.
error.ACCESS_TOKEN_INVALID=다시 로그인해 주세요.
error.SESSION_REVOKED=로그인 세션이 종료되었습니다. 다시 로그인해 주세요.

# 토큰 재발급·로그아웃
error.INVALID_REFRESH_TOKEN=다시 로그인해 주세요.

# 약관 조회 응답의 항목 제목. 키 규칙: agreement.{동의 항목 type}.title (application.yml app.agreement.items)
agreement.TERMS.title=서비스 이용약관
agreement.PRIVACY.title=개인정보 수집·이용 동의
agreement.AI_RISK_DETECTION.title=AI 대화 위험 감지를 위한 개인정보 처리 동의
agreement.ADULT.title=만 19세 이상입니다
