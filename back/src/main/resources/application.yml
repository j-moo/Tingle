# YAML은 UTF-8로 읽혀서 한글 값을 그대로 쓸 수 있다 (.properties는 한글이 깨진다).
spring:
  application:
    name: tingle
  profiles:
    # 프로필을 지정하지 않고 실행하면 local 로 뜬다. 서버는 dev·prod 프로필로 뜨며 두 프로필은 같은 기능·같은 필수값을 쓴다.
    default: local
  docker:
    compose:
      # compose.yaml 로 DB를 띄우는 것은 local 에서만 한다 (application-local.yml).
      enabled: false
  config:
    # back/.env 가 있으면 읽는다. 실제 값은 .env 에만 두고 커밋하지 않는다 (.env.example 참고).
    import: optional:file:.env[.properties]
  datasource:
    # 비어 있으면 로컬은 compose.yaml, 테스트는 Testcontainers 가 연결 정보를 채운다.
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      data-source-properties:
        # DB 오류 메시지에 입력값(예: "Key (email)=(...) already exists", 배치 SQL 값)을 넣지 않는다. 예외가 로그로 나가도 개인정보가 남지 않게 한다.
        logServerErrorDetail: false
  servlet:
    multipart:
      # 프로필 사진 원본 최대 10MB. 넘으면 400 PHOTO_INVALID (서비스도 같은 한도를 다시 확인한다).
      max-file-size: 10MB
      max-request-size: 11MB
  web:
    resources:
      # 앱 전용 JSON API 서버라 정적 파일(HTML·이미지)을 내보내지 않는다. 없는 경로는 JSON 404로 응답한다.
      add-mappings: false
  # @Scheduled 작업이 15개라 스레드 1개면 새 작업이 1초 주기 채팅 푸시를 늦출 수 있다.
  task:
    scheduling:
      pool:
        size: 4
  jackson:
    default-property-inclusion: always
    deserialization:
      fail-on-unknown-properties: true
  jpa:
    hibernate:
      # 공통 기본값은 검증만 한다. 테이블 자동 변경은 local(update)·test(create-drop) 프로필에서만 켠다.
      # (docs/convention/backend-convention.md [db-schema], [env-profiles])
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # enum 컬럼에 CHECK 제약을 만들지 않는다 (선택지 추가 시 기존 DB 호환, 클래스 주석 참고)
        dialect: com.e106.tingle.global.jpa.NoColumnCheckPostgreSqlDialect
        hbm2ddl:
          halt_on_error: true

logging:
  pattern:
    # 로그 줄마다 추적 번호를 붙인다. 요청이면 응답 헤더 X-Request-Id 와 같은 값, 예약 작업이면 실행마다 새 값(global/trace).
    correlation: "[%X{requestId:-}] "

# 서버 상태 확인(배포·Jenkins 가 호출). DB 연결까지 확인해 정상이면 200 {"status":"UP"}, 아니면 503.
# health 하나만 열고, 세부 정보(DB 종류 등)는 응답에 넣지 않는다.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# 아래 app 설정은 개발·운영이 같은 코드 경로로 돈다(기능을 켜고 끄는 값이 없다).
# withdrawal · keyring.dev-settings · keyring.peer · push · chat-message-push 의 환경변수는 필수다
# (profile-device-serials 만 빈 값 허용). 비었거나 올바르지 않으면 기동하지 않는다. local·test 는 시험용 값을 따로 준다.
app:
  withdrawal:
    # 탈퇴 HMAC 비밀값(32바이트 이상)
    identity-secret: ${WITHDRAWAL_IDENTITY_SECRET:}
    receipt-secret: ${WITHDRAWAL_RECEIPT_SECRET:}
  # 인증 (팀 공유 인증 API 계약)
  auth:
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl: 30m
    refresh-token-ttl: 14d
    refresh-reuse-grace: 30s
    google-client-id: ${GOOGLE_WEB_CLIENT_ID:}
    kakao-app-id: ${KAKAO_APP_ID:}
    # 네이버 OIDC: 앱이 넘긴 인가 코드를 서버가 비밀값으로 교환한다. 콜백 주소는 운영 앱 기준(개발 앱은 application-dev.yml).
    naver-client-id: ${NAVER_CLIENT_ID:}
    naver-client-secret: ${NAVER_CLIENT_SECRET:}
    naver-redirect-uri: ${NAVER_REDIRECT_URI:https://k15e106.p.ssafy.io/auth/naver/callback}
    # 액세스 토큰에 iss·aud 가 있으면 이 값과 같아야 한다(없으면 통과).
    issuer: tingle
    audience: mobile-app

  proposals:
    decline-days: 30

  keyring:
    # 구매처를 임의 지정하지 않는다. 미설정이면 API는 purchaseUrl:null을 반환한다.
    purchase-url: ${KEYRING_PURCHASE_URL:}
    # 키링 설정 서명 키(Ed25519 PEM). 개발·운영이 같은 키를 쓴다(11-11 결정 B).
    dev-settings:
      private-key-file: ${KEYRING_DEV_SETTINGS_PRIVATE_KEY_FILE:}
      public-key-file: ${KEYRING_DEV_SETTINGS_PUBLIC_KEY_FILE:}
      # TPS1 저장 지원을 확인한 기기 일련번호만 등록한다(기기 능력 목록). 쉼표로 구분하며 비어 있어도 된다.
      profile-device-serials: ${KEYRING_DEV_SETTINGS_PROFILE_DEVICE_SERIALS:}
    # TSV3 정책 값. 비었거나 펌웨어 값과 다르면 기동하지 않는다(PeerPolicyProperties).
    # server-public-key-hex 는 위 서명 키의 공개키(32바이트 hex)와 같아야 한다.
    peer:
      # 코드에 포함한 릴리즈(resources/database/keyring-rule-release.sql)의 번호와 해시. 운영·개발이 같은 값을 쓴다.
      business-rule-release-id: 603836ce-358a-4863-abcb-31f2b0468afb
      business-release-hash: 81c466388be59fcdae1fec53609d28922f1bc59e199392cac77cb0ca1fed7540
      policy-version: ${KEYRING_PEER_POLICY_VERSION:}
      rule-version: ${KEYRING_PEER_RULE_VERSION:}
      lease-seconds: ${KEYRING_PEER_LEASE_SECONDS:}
      opportunity-seconds: ${KEYRING_PEER_OPPORTUNITY_SECONDS:}
      presence-gap-seconds: ${KEYRING_PEER_PRESENCE_GAP_SECONDS:}
      server-public-key-hex: ${KEYRING_PEER_SERVER_PUBLIC_KEY_HEX:}

  # 새 설문 회차가 쓰는 설문 버전 (resources/survey/questionnaires/{버전}.json). 바꿔도 이미 시작한 회차는 원래 버전을 쓴다.
  survey:
    current-version: SIS-Q-1.1-100

  # 현재 적용 중인 동의 항목. 화면 제목은 messages.properties 의 agreement.{type}.title. 항목 추가·삭제, 버전 변경은 여기만 고치면 된다 (코드·앱 수정 불필요).
  # 버전을 올리면 이전 버전으로 들어온 가입 요청은 AGREEMENT_VERSION_OUTDATED 가 된다. 목록 순서대로 화면에 표시된다.
  agreement:
    items:
      - type: TERMS
        version: "2026-10-19"
        required: true
        content-url: ${TERMS_CONTENT_URL:https://example.com/terms}
      - type: PRIVACY
        version: "2026-10-19"
        required: true
        content-url: ${PRIVACY_CONTENT_URL:https://example.com/privacy}
      # 기능 명세 §2.7: 가입 전 별도 필수 동의. 외부 전송 적용 전 확인 조건은 AI-02 기준
      - type: AI_RISK_DETECTION
        version: "2026-10-22"
        required: true
        content-url: ${AI_RISK_CONTENT_URL:https://example.com/ai-risk}
      - type: ADULT
        version: "2026-10-19"
        required: true
      # 선택 정보별 동의(기능 명세 PRO-01·V211). 거부해도 가입·기본 이용은 된다. 동의 없이는 그 정보를 저장하지 않고,
      # 철회하면 저장한 값·사진을 바로 지운다. 가입 동의 요청에서는 빠져도 되고 /optional-consents 로 따로 바꾼다.
      - type: PROFILE_PHOTO
        version: "2026-11-02"
        required: false
      - type: PROFILE_INTRODUCTION
        version: "2026-11-02"
        required: false
      - type: PROFILE_RELIGION
        version: "2026-11-02"
        required: false

  # 서버 푸시(FCM). 서비스 계정 키는 GOOGLE_APPLICATION_CREDENTIALS 파일로 받는다.
  push:
    project-id: ${FIREBASE_PROJECT_ID:}
    # JWT와 별도인 Base64 32바이트 키
    token-encryption-key: ${PUSH_TOKEN_ENCRYPTION_KEY:}
  # 새 메시지 푸시 작업(종료 안내 정책과 독립). 주기(ms)는 필수다.
  chat-message-push:
    poll-ms: ${CHAT_MESSAGE_PUSH_POLL_MS:}
  # AI 서버 호출(서비스 토큰). 개발·운영은 네 값 모두 필수다(ServerSettingsCheck). environment 는 AI 의 APP_ENV 와 같아야 한다.
  ai:
    service:
      environment: ${APP_AI_SERVICE_ENVIRONMENT:}
      base-url: ${APP_AI_SERVICE_BASE_URL:}
      key-id: ${APP_AI_SERVICE_KEY_ID:}
      private-key-file: ${APP_AI_SERVICE_PRIVATE_KEY_FILE:}
  # AI 시작 질문 릴리스 파일. 개발·운영은 필수다(ServerSettingsCheck).
  icebreaker:
    manifest-location: ${APP_ICEBREAKER_MANIFEST_LOCATION:}
  chat-notices:
    scheduling-enabled: true
    poll-ms: 15000

tingle:
  chat:
    deletion:
      # 채팅 삭제 기록(저널) 폴더. DB 백업에서 복원하면 이 기록으로 지운 채팅을 다시 지운다.
      # 기본값은 사진 영구 볼륨 안이라 블루·그린이 함께 쓰고 재배포에도 남는다. 첫 삭제 때 자동으로 만든다.
      journal-directory: ${TINGLE_CHAT_DELETION_JOURNAL_DIRECTORY:${tingle.photo.dir}/.chat-deletion-journal}
  photo:
    # 프로필 사진 파일을 두는 서버 폴더. DB(profile.photo_url)에는 이 폴더 기준 키(profile/{userId}/{uuid}.jpg)만 저장한다.
    # 운영은 blue·green 컨테이너가 함께 쓰는 영구 볼륨을 지정하고 백업한다. 미설정이면 임시 폴더(로컬·테스트용).
    dir: ${PHOTO_STORAGE_DIR:${java.io.tmpdir}/tingle-photos}
  ai:
    # 개인 성향 분석(AI 서버). 공통 AI 설정(app.ai.service)의 서명 키가 없으면(local·test) 요청은 PENDING 으로 남는다.
    personal-analysis:
      analysis-version: SIS-A-1.0
      survey-versions:
        - SIS-Q-1.1-100
      # 최초 실행을 포함한 최대 실행 횟수. 400·409·422 처럼 다시 보내도 같은 오류는 바로 FAILED.
      max-attempts: 3
      retry-delay: 1m
      # 실행을 잡은 뒤 이 시간이 지나도 끝나지 않으면(서버 재시작 등) 다시 실행한다.
      stuck-after: 5m
      scheduling-enabled: true
      poll-ms: 2000
