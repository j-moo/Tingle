# 서버 /srv/tingle 에서 실행: docker compose --env-file /srv/tingle/.env --env-file /srv/tingle/app.env -f infra/docker-compose.yml up -d --build
# .env 는 Jenkins 를 띄우는 값(손으로 관리), app.env 는 앱 비밀값(Jenkins Credentials 에서 develop 빌드마다 다시 씀, 직접 수정 금지).
# 호스트에 여는 포트는 nginx 의 80·443 뿐이다 (Docker publish 는 ufw 를 우회한다). 나머지는 내부망 이름으로만 호출.
name: tingle

services:
  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:?}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro # ${DOMAIN} 을 치환해 /etc/nginx/conf.d/ 로 복사된다
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro # certbot webroot 갱신 경로
      - /srv/tingle/nginx-state:/etc/nginx/state:ro # 블루-그린 운영 색 (infra/deploy-bluegreen.sh 가 씀)
      - /srv/tingle/app:/srv/tingle/app:ro # /app/ 앱 설치 파일 (Jenkins 가 씀)
    depends_on:
      - web
      - web-dev
    networks:
      default:
        aliases: [ai] # back 이 부르는 http://ai:8000 은 nginx 가 받아 운영 색(ai-blue · ai-green)으로 넘긴다 (블루-그린)
    mem_limit: 128m
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?} # 사용자·비밀번호는 볼륨이 비어 있을 때만 적용된다. 이후 변경은 DB 에서 ALTER ROLE
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: tingle # 운영. 개발 DB tingle_dev 는 db/init.sql 이 첫 기동 때 만든다
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    mem_limit: 1g
    restart: unless-stopped

  jenkins:
    build: ./jenkins # 공식 LTS + docker CLI + 플러그인 + 설정 코드(jenkins/casc)
    environment:
      JENKINS_OPTS: --prefix=/jenkins
      DOMAIN: ${DOMAIN:?}
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:?}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?}
      GITLAB_WEBHOOK_SECRET: ${GITLAB_WEBHOOK_SECRET:?}
    group_add:
      - '${DOCKER_GID:?}' # 서버 docker 그룹 번호(getent group docker) — 소켓으로 빌드·배포
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/tingle:/srv/tingle # app.env 쓰기 · 배포 (서버와 같은 경로)
      - /backup:/backup # 운영 배포 전 DB 백업
    mem_limit: 1536m
    restart: unless-stopped

  web:
    build: ../front/web
    mem_limit: 64m
    restart: unless-stopped

  web-dev:
    build:
      context: ../front/web
      args:
        BASE: /dev/
    mem_limit: 64m
    restart: unless-stopped

  # back: 운영(prod, DB tingle, 블루-그린 back-blue · back-green 중 한쪽만 켬) · 개발(dev, DB tingle_dev). nginx 가 /api/ /ws/ → back, /dev/api/ /dev/ws/ → back-dev 로 넘긴다.
  # 테이블은 미리 있어야 한다 (ddl-auto validate). 처음엔 back/database/schema.sql 을 넣었다 — 이후 스키마 변경은 BE 가 DB 에 반영.
  # 비밀값은 app.env (Jenkins Credentials tingle-app-env 파일 하나). 소셜 로그인 키는 구글 · 카카오만 (네이버는 서버 키 없음).
  back-blue:
    build: ../back
    environment: &back-env
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/tingle
      # 환경별 가입 키링 요구값은 Jenkins tingle-app-env에서 관리한다.
      TINGLE_SIGNUP_KEYRING_REQUIRED: "${TINGLE_PROD_SIGNUP_KEYRING_REQUIRED:-true}"
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:?}
      PUSH_TOKEN_ENCRYPTION_KEY: ${PUSH_TOKEN_ENCRYPTION_KEY:?}
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-} # 소셜 토큰 검증(back application.yml google-client-id · kakao-app-id). 비면 그 공급자 로그인만 실패
      KAKAO_APP_ID: ${KAKAO_APP_ID:-}
      # 네이버 OIDC: 서버가 앱이 보낸 인가 코드를 비밀값으로 교환하고 id_token 의 aud 를 Client ID 와 대조한다(S15P31E106-193). 비밀값은 서버에만
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      # 푸시(FCM): Jenkins Credentials 에 tingle-fcm(서비스 계정 JSON)이 있으면 Jenkins 가 키 파일을 쓰고 app.env 에 켜는 값을 넣는다. 없으면 꺼진 채로 뜬다.
      PUSH_ENABLED: ${PUSH_ENABLED:-false}
      CHAT_MESSAGE_PUSH_SCHEDULING_ENABLED: ${CHAT_MESSAGE_PUSH_SCHEDULING_ENABLED:-false}
      CHAT_MESSAGE_PUSH_POLL_MS: ${CHAT_MESSAGE_PUSH_POLL_MS:-1000}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/tingle/fcm.json
      PHOTO_STORAGE_DIR: /data/photos # 프로필 사진 파일 폴더. 아래 볼륨으로 호스트 /data/uploads/{prod|dev} 에 둔다 (backup-daily.sh 백업 대상)
      # 가입 화면 약관 전문 링크(back application.yml agreement content-url). front/web/public 정적 페이지. 비밀값이 아니라 app.env 대신 여기 둔다. 끝의 / 는 빼면 안 된다(S15P31E106-220)
      TERMS_CONTENT_URL: https://${DOMAIN:?}/terms/
      PRIVACY_CONTENT_URL: https://${DOMAIN:?}/privacy/
      AI_RISK_CONTENT_URL: https://${DOMAIN:?}/ai-risk/
      # 키링 구매 안내 링크(back application.yml keyring purchase-url). app.env 에 있으면 그 값, 없으면 빈 값 → 서버가 null → 앱이 구매하기 줄을 숨긴다(S15P31E106-308)
      KEYRING_PURCHASE_URL: ${KEYRING_PURCHASE_URL:-}
      # 키링 설정·명령 서명. 운영도 개발 서명 키를 같이 쓴다(11-11 결정 B, 펌웨어 고정 공개키). 1바이트 ON/OFF·TPS1은 운영에서 서버가 막는다.
      # 키 파일·정책 값은 개발과 같은 이름을 쓴다. 켜는 값과 DB 행 값은 PROD_ 이름으로 따로 켠다(기본 OFF, /srv/tingle/.env).
      KEYRING_DEV_SETTINGS_ENABLED: "${PROD_KEYRING_DEV_SETTINGS_ENABLED:-false}"
      KEYRING_DEV_SETTINGS_PRIVATE_KEY_FILE: "${KEYRING_DEV_SETTINGS_PRIVATE_KEY_FILE:-/run/secrets/tingle/dev-settings-private.pem}"
      KEYRING_DEV_SETTINGS_PUBLIC_KEY_FILE: "${KEYRING_DEV_SETTINGS_PUBLIC_KEY_FILE:-/run/secrets/tingle/dev-settings-public.pem}"
      # TSV3·소유 세션·만남 접수(S15P31E106-270). 기본 OFF·빈 값이면 422 POLICY_UNRESOLVED.
      # 켜기 전에 tingle · tingle_dev 에 infra/db/prod-changes/2026-11-06-peer-flow-270.sql 을 먼저 적용한다.
      KEYRING_PEER_ENABLED: "${PROD_KEYRING_PEER_ENABLED:-false}"
      KEYRING_PEER_ENCOUNTERS_ENABLED: "${PROD_KEYRING_PEER_ENCOUNTERS_ENABLED:-false}"
      KEYRING_PEER_REVIEW_INTAKE_APPROVED: "${PROD_KEYRING_PEER_REVIEW_INTAKE_APPROVED:-false}"
      KEYRING_PEER_BUSINESS_INTAKE_ENABLED: "${PROD_KEYRING_PEER_BUSINESS_INTAKE_ENABLED:-false}"
      KEYRING_PEER_BUSINESS_RULE_RELEASE_ID: "${PROD_KEYRING_PEER_BUSINESS_RULE_RELEASE_ID:-}"
      KEYRING_PEER_BUSINESS_RELEASE_HASH: "${PROD_KEYRING_PEER_BUSINESS_RELEASE_HASH:-}"
      KEYRING_PEER_RELEASE_POLICY_APPROVED: "${PROD_KEYRING_PEER_RELEASE_POLICY_APPROVED:-false}"
      KEYRING_PEER_POLICY_APPROVED: "${PROD_KEYRING_PEER_POLICY_APPROVED:-false}"
      KEYRING_PEER_POLICY_VERSION: "${KEYRING_PEER_POLICY_VERSION:-0}"
      KEYRING_PEER_RULE_VERSION: "${KEYRING_PEER_RULE_VERSION:-0}"
      KEYRING_PEER_LEASE_SECONDS: "${KEYRING_PEER_LEASE_SECONDS:-0}"
      KEYRING_PEER_OPPORTUNITY_SECONDS: "${KEYRING_PEER_OPPORTUNITY_SECONDS:-0}"
      KEYRING_PEER_PRESENCE_GAP_SECONDS: "${KEYRING_PEER_PRESENCE_GAP_SECONDS:-0}"
      KEYRING_PEER_SERVER_PUBLIC_KEY_HEX: "${KEYRING_PEER_SERVER_PUBLIC_KEY_HEX:-}"
      # 키링 판정(KeyringVerdictEvaluator)으로 만남을 제안까지 잇는 평가 워커. 기본 OFF. 승인·게시된 키링 규칙 조합이 있어야 한다.
      APP_ENCOUNTER_EVALUATION_ENABLED: "${PROD_APP_ENCOUNTER_EVALUATION_ENABLED:-false}"
    volumes: &back-volumes
      - /srv/tingle/secrets:/run/secrets/tingle:ro # Jenkins 가 쓰는 비밀 파일 (fcm.json)
      - /data/uploads/prod:/data/photos # 운영 사진. 블루 · 그린이 같은 폴더를 함께 쓴다. 호스트 폴더 소유자는 이미지 실행 사용자(uid 1000)
    depends_on: [db]
    mem_limit: 1536m
    restart: unless-stopped

  back-green:
    build: ../back
    environment: *back-env
    volumes: *back-volumes
    depends_on: [db]
    mem_limit: 1536m
    restart: unless-stopped

  back-dev:
    build: ../back
    environment:
      <<: *back-env
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/tingle_dev
      TINGLE_SIGNUP_KEYRING_REQUIRED: "${TINGLE_DEV_SIGNUP_KEYRING_REQUIRED:-true}"
      TERMS_CONTENT_URL: https://${DOMAIN:?}/dev/terms/ # 개발은 develop 에 머지된 web-dev 페이지
      PRIVACY_CONTENT_URL: https://${DOMAIN:?}/dev/privacy/
      AI_RISK_CONTENT_URL: https://${DOMAIN:?}/dev/ai-risk/
      # AI 서버 호출(app.ai.service, S15P31E106-234). 서비스 토큰 서명 키는 서버에 손으로 둔 파일이다(비밀 키는 secrets, 공개 키는 ai-keys).
      # 키 파일 없이 켜면 back-dev 가 뜨지 않는다. 운영은 키를 따로 만든 뒤 연결한다
      APP_AI_SERVICE_ENABLED: "true"
      APP_AI_SERVICE_ENVIRONMENT: dev
      APP_AI_SERVICE_BASE_URL: http://ai-dev:8000
      APP_AI_SERVICE_KEY_ID: be-dev-1
      APP_AI_SERVICE_PRIVATE_KEY_FILE: /run/secrets/tingle/ai-service-dev.pem
      # Q040 개발 릴리스는 외부 승인된 파일을 양쪽 서비스에 동일하게 등록한다.
      APP_ICEBREAKER_EXTERNAL_ENABLED: "${Q040_DEV_ENABLED:-false}"
      APP_ICEBREAKER_MANIFEST_LOCATION: file:/run/tingle/q040-dev-release-v1/be-descriptor.json
      # TPS1(196B 프로필) 허용 기기. 11-06 별도 override 파일로만 넣어 Jenkins 재배포 때 풀리던 값을 여기서 전달한다.
      KEYRING_DEV_SETTINGS_PROFILE_DEVICE_SERIALS: "${KEYRING_DEV_SETTINGS_PROFILE_DEVICE_SERIALS:-}"
      # 키링 ON/OFF·DB 행 값은 개발 이름 그대로 덮어쓴다(운영은 위 PROD_ 이름).
      # 키링 초기화(app.keyring-reset)는 개발에만 둔다. 운영 DB 에는 keyring_reset_run 표가 없어 켜면 동기화가 500 이 된다.
      app.keyring-reset.enabled: "${KEYRING_RESET_DEV_ENABLED:-false}"
      KEYRING_DEV_SETTINGS_ENABLED: "${KEYRING_DEV_SETTINGS_ENABLED:-false}"
      KEYRING_PEER_ENABLED: "${KEYRING_PEER_ENABLED:-false}"
      KEYRING_PEER_ENCOUNTERS_ENABLED: "${KEYRING_PEER_ENCOUNTERS_ENABLED:-false}"
      KEYRING_PEER_REVIEW_INTAKE_APPROVED: "${KEYRING_PEER_REVIEW_INTAKE_APPROVED:-false}"
      KEYRING_PEER_BUSINESS_INTAKE_ENABLED: "${KEYRING_PEER_BUSINESS_INTAKE_ENABLED:-false}"
      KEYRING_PEER_BUSINESS_RULE_RELEASE_ID: "${KEYRING_PEER_BUSINESS_RULE_RELEASE_ID:-}"
      KEYRING_PEER_BUSINESS_RELEASE_HASH: "${KEYRING_PEER_BUSINESS_RELEASE_HASH:-}"
      KEYRING_PEER_RELEASE_POLICY_APPROVED: "${KEYRING_PEER_RELEASE_POLICY_APPROVED:-false}"
      KEYRING_PEER_POLICY_APPROVED: "${KEYRING_PEER_POLICY_APPROVED:-false}"
      APP_ENCOUNTER_EVALUATION_ENABLED: "${APP_ENCOUNTER_EVALUATION_ENABLED:-false}"
      # 채팅 삭제 뒤 백업 사본 확인(S15P31E106-202 · 250). 서버 cron 이 1분마다 /srv/tingle/backup-evidence 에 쓰는 메타데이터만 읽는다(/backup 은 붙이지 않음).
      # 켜는 값은 서버 /srv/tingle/.env 의 BACKUP_EVIDENCE_ENABLED=true. 범위 · 승인 ID 는 공개 식별자(docs/specifications/functional-spec-v3/backup-evidence-v1.md)
      APP_BACKUP_EVIDENCE_ENABLED: "${BACKUP_EVIDENCE_ENABLED:-false}"
      APP_BACKUP_EVIDENCE_FILE: /backup-evidence/tingle_dev.json
      APP_BACKUP_EVIDENCE_GENERATION_FILE: /backup-evidence/tingle_dev.restore-generation
      APP_BACKUP_EVIDENCE_NAMESPACE: tingle_dev
      APP_BACKUP_EVIDENCE_SCOPE_ID: tingle-dev-db-dumps-v1
      APP_BACKUP_EVIDENCE_APPROVAL_ID: S15P31E106-202-DEV-DB-V1-20261105
    volumes: # 개발 사진은 운영과 섞이지 않게 따로 둔다
      - /srv/tingle/secrets:/run/secrets/tingle:ro
      - /data/uploads/dev:/data/photos
      - ${Q040_DEV_RELEASE_DIR:-/srv/tingle/releases/q040-dev-release-v1}:/run/tingle/q040-dev-release-v1:ro
      - /srv/tingle/backup-evidence:/backup-evidence:ro # 백업 증거 메타데이터(소유 ubuntu, 0750/0640). 컨테이너는 uid 1000 이라 호스트 ubuntu 가 1000 이어야 읽힘(아니면 group_add). 없으면 배포 때 root 소유로 생김 → 준비 때 chown
    depends_on: [db]
    mem_limit: 1536m
    restart: unless-stopped

  # ai: 운영(ai-blue · ai-green 중 한쪽만 켬, back 은 http://ai:8000 → nginx 가 운영 색으로 전달) · 개발(ai-dev, back-dev 가 http://ai-dev:8000 으로 직접 호출).
  # 외부에 열지 않는다. Dockerfile 기본값이 HOST=0.0.0.0 · PORT=8000 · APP_ENV=prod. GMS 키(GMS_API_KEY)는 Credentials → app.env 로 받고 지금은 ai-dev 에만 넘긴다.
  ai-blue:
    build: ../ai-server
    mem_limit: 512m
    restart: unless-stopped

  ai-green:
    build: ../ai-server
    mem_limit: 512m
    restart: unless-stopped

  ai-dev:
    build: ../ai-server
    # 개발 전용 구성(app.development): 아래 스위치가 켜진 기능만 GMS 로 생성하고, 나머지는 app.main 과 같다. 운영(ai-blue · ai-green)은 기본 CMD 그대로.
    command: [python, -m, uvicorn, "app.development:create_app", --factory, --host, 0.0.0.0, --port, "8000"]
    environment:
      APP_ENV: dev
      # GMS: 키는 Jenkins Credentials tingle-app-env(app.env)의 GMS_API_KEY. 스위치가 꺼져 있으면 키를 읽지 않고 app.main 과 똑같이 동작한다.
      # 켜려면 서버 .env 에 ICEBREAKER_GMS_DEV_ENABLED=true 를 넣고 ai-dev 를 다시 띄운다(AI 담당과 Release 확인 후). 켰는데 키가 없으면 기동을 거절한다.
      GMS_API_KEY: "${GMS_API_KEY:-}"
      ICEBREAKER_GMS_DEV_ENABLED: "${ICEBREAKER_GMS_DEV_ENABLED:-false}"
      # Match Insight GMS 는 개발용 Release(descriptor · artifact)를 서버에 둔 뒤 EXPLANATION_RELEASE_DESCRIPTOR_FILES 와 함께 켠다. 파일 없이 경로만 넣으면 기동이 실패한다.
      MATCH_INSIGHT_GMS_DEV_ENABLED: "false"
      AI_SERVICE_PUBLIC_KEYS: '{"be-dev-1":"/run/ai-keys/be-dev-1.pub.pem"}' # back-dev 서명 키와 짝. 파일이 없으면 기동을 거절한다
      ICEBREAKER_DEV_ENABLED: "${Q040_DEV_ENABLED:-false}"
      ICEBREAKER_RELEASE_DESCRIPTOR_FILE: /run/tingle/q040-dev-release-v1/ai-descriptor.json
    volumes:
      - /srv/tingle/ai-keys/dev:/run/ai-keys:ro # 공개 키만 둔다(비밀값 아님). 컨테이너 사용자(uid 10001)가 읽도록 644
      - ${Q040_DEV_RELEASE_DIR:-/srv/tingle/releases/q040-dev-release-v1}:/run/tingle/q040-dev-release-v1:ro
    mem_limit: 512m
    restart: unless-stopped

  # 모니터링 (인프라 계획 10절, 합계 메모리 1GB 안). Grafana 만 nginx /grafana/ 로 열고 나머지는 내부망 전용.
  # 지표: Prometheus 가 node-exporter(서버 + container-stats 가 쓴 컨테이너별 메모리 · CPU)를 모은다. 로그: Alloy 가 모든 컨테이너 로그를 Loki 로 보낸다.
  # API 응답 시간 · 에러율은 nginx 접근 로그(JSON)를 Loki 에서 계산한다. 인프라라 Jenkins 가 아닌 손으로 띄운다 (nginx · db · jenkins 와 같음).
  prometheus:
    image: prom/prometheus:v3.5.0
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=15d]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    mem_limit: 256m
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.10.2
    command: [--path.rootfs=/host, --collector.textfile.directory=/textfile]
    pid: host
    volumes:
      - /:/host:ro,rslave
      - textfile:/textfile:ro # container-stats 가 쓰는 컨테이너별 지표
    mem_limit: 64m
    restart: unless-stopped

  container-stats:
    image: docker:29-cli
    entrypoint: [sh, /container-stats.sh]
    volumes:
      - ./monitoring/container-stats.sh:/container-stats.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - textfile:/textfile
    mem_limit: 32m
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.5
    command: [-config.file=/etc/loki/loki.yml]
    volumes:
      - ./monitoring/loki.yml:/etc/loki/loki.yml:ro
      - loki:/loki
    mem_limit: 256m
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.11.0
    command: [run, --storage.path=/var/lib/alloy/data, /etc/alloy/config.alloy]
    volumes:
      - ./monitoring/alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy:/var/lib/alloy/data # 컨테이너별 읽은 위치 — 재시작해도 로그를 두 번 보내지 않는다
    mem_limit: 128m
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_SERVER_ROOT_URL: https://${DOMAIN:?}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?} # 첫 기동 때만 적용. 이후 변경은 grafana cli admin reset-admin-password
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    volumes:
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro # tingle.json
      # 개발 비동기 관측 규칙만 등록한다. 수신 채널 승인 전에는 모든 규칙을 paused로 유지한다.
      - ./monitoring/grafana/alerting:/etc/grafana/provisioning/alerting:ro
      - grafana:/var/lib/grafana
    depends_on: [prometheus, loki]
    mem_limit: 192m
    restart: unless-stopped

volumes:
  pgdata:
  jenkins_home:
  prometheus:
  loki:
  alloy:
  grafana:
  textfile:
